<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creación de Empresas</title>
    <link rel="stylesheet" href="../../style/registros.css">
    <script defer src="../../script/registro_empresa.js"></script>
</head>

<body>
    
    <aside>
        <a href="../home.html" id="home-link">Home</a>
        <a href="../alumnos.html" id="alumn-link">Creación de Alumnos</a>
        <a href="../empresas.html" id="client-link">Creación de Empresas</a>
        <a href="../relaciones.html" id="relation-link">Crear Asignaciones</a>
        <a href="../informacion.html" id="information-link">Consultar Base de Datos</a>
    </aside>

    <div class="logoff-container">
        <a href="../../index.html" class="logoff-button">Cerrar Sesión</a>
    </div>
    <main>
        <h2>Formulario de Registros</h2>
        <form action="/server" method="POST">

            <label for="observacion">Observaciones:</label>
            <input type="text" id="observacion" name="observacion" required>

            <label for="fecha_asignacion">Fecha de Registro:</label>
            <input type="text" id="fecha_asignacion" name="fecha_asignacion" placeholder="YYYY/MM/DD" required>

            <div class="checkbox-container">
                <label for="llamada_registrada">Llamada telefonica:</label>
                <input type="checkbox" id="llamada_registrada" name="llamada_registrada">
                
                <label for="correo_registrado">Correo Electronico:</label>
                <input type="checkbox" id="correo_registrado" name="correo_registrado">

                <label for="reunion_registrada">Reunion:</label>
                <input type="checkbox" id="reunion_registrada" name="reunion_registrada">
            </div>

            <button type="submit" id="enviarButton">Enviar</button>
        </form>
    </main>
</body>

</html>
